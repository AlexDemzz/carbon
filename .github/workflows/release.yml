# Builds, signs, notarizes and publishes Carbon on a `vX.Y.Z` tag (e.g. `git tag -a v0.1.0`).
# Without the signing secrets, or when run by hand, it is a dry run: an unsigned build plus the
# CarbonCore tests, with every signing, upload and GitHub Release step skipped and reported.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUCKET: carbon-releases
  SITE: https://carbon.alexandrejoly.me
  DERIVED_DATA: build/DerivedData
  WRANGLER: npx --yes wrangler@4.151.1

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide what this run does
        id: mode
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          for name in DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD DEVELOPMENT_TEAM NOTARY_KEY_P8 \
            NOTARY_KEY_ID NOTARY_ISSUER_ID SPARKLE_ED_PRIVATE_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"$/\1/p' project.yml)"
          fi
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            release=false
            echo "::notice::Not a version tag: dry run, signing, notarization and upload are skipped."
          elif [ ${#missing[@]} -gt 0 ]; then
            release=false
            echo "::notice::Missing secrets (${missing[*]}): dry run, signing, notarization and upload are skipped."
          else
            release=true
          fi
          {
            echo "release=$release"
            echo "version=$version"
            echo "build=$GITHUB_RUN_NUMBER"
            echo "dmg=Carbon-$version.dmg"
          } >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      # 1. Temporary keychain import
      - name: Import the Developer ID certificate into a temporary keychain
        if: steps.mode.outputs.release == 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(uuidgen)"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # The .p12 holds only the leaf: without its intermediate the identity is not valid.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user | xargs security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/developer-id.p12"

      # 2. Archive and Developer ID export
      - name: Archive and export with Developer ID
        if: steps.mode.outputs.release == 'true'
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          VERSION: ${{ steps.mode.outputs.version }}
          BUILD: ${{ steps.mode.outputs.build }}
        run: |
          xcodebuild archive -project Carbon.xcodeproj -scheme Carbon -configuration Release \
            -derivedDataPath "$DERIVED_DATA" -archivePath build/Carbon.xcarchive -jobs 2 \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS=--timestamp
          sed "s/TEAM_ID/$DEVELOPMENT_TEAM/" scripts/release/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath build/Carbon.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export
          codesign --verify --deep --strict --verbose=2 build/export/Carbon.app

      - name: Build unsigned (dry run)
        if: steps.mode.outputs.release != 'true'
        env:
          VERSION: ${{ steps.mode.outputs.version }}
          BUILD: ${{ steps.mode.outputs.build }}
        run: |
          echo "::notice::Dry run: building an unsigned app, no Developer ID signature."
          xcodebuild build -project Carbon.xcodeproj -scheme Carbon -configuration Release \
            -derivedDataPath "$DERIVED_DATA" -jobs 2 \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" CODE_SIGNING_ALLOWED=NO
          mkdir -p build/export
          cp -R "$DERIVED_DATA/Build/Products/Release/Carbon.app" build/export/

      # 3. CarbonCore tests
      - name: Test CarbonCore
        working-directory: CarbonCore
        run: swift test -j 2 --parallel --num-workers 2

      - name: Test the appcast script
        working-directory: scripts/release
        run: python3 -m unittest -v

      - name: Test the release Worker
        working-directory: worker
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run check-types

      # 4. DMG with the install window: app, Applications symlink, background, volume icon
      - name: Make the DMG
        env:
          DMG: ${{ steps.mode.outputs.dmg }}
        run: scripts/release/make-dmg.sh build/export/Carbon.app "build/$DMG"

      # 5. Sign, notarize and staple the DMG
      - name: Sign, notarize and staple the DMG
        if: steps.mode.outputs.release == 'true'
        env:
          DMG: ${{ steps.mode.outputs.dmg }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          codesign --sign "Developer ID Application" --timestamp "build/$DMG"
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "build/$DMG" --wait \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          rm "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "build/$DMG"
          xcrun stapler validate "build/$DMG"

      # 6. Sparkle signature
      - name: Sign the DMG for Sparkle
        id: sparkle
        if: steps.mode.outputs.release == 'true'
        env:
          DMG: ${{ steps.mode.outputs.dmg }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          sign_update="$DERIVED_DATA/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
          signature="$(echo "$SPARKLE_ED_PRIVATE_KEY" | "$sign_update" --ed-key-file - -p "build/$DMG")"
          echo "signature=$signature" >> "$GITHUB_OUTPUT"
          echo "length=$(stat -f %z "build/$DMG")" >> "$GITHUB_OUTPUT"

      # 7. Appcast, with the release notes from the tag's annotation
      - name: Regenerate the appcast
        if: steps.mode.outputs.release == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.mode.outputs.version }}
          BUILD: ${{ steps.mode.outputs.build }}
          DMG: ${{ steps.mode.outputs.dmg }}
          SIGNATURE: ${{ steps.sparkle.outputs.signature }}
          LENGTH: ${{ steps.sparkle.outputs.length }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git for-each-ref "refs/tags/$GITHUB_REF_NAME" \
            --format='%(contents:subject)%0a%0a%(contents:body)' > build/notes.txt
          if $WRANGLER r2 object get "$BUCKET/appcast.xml" --remote --file build/previous-appcast.xml; then
            echo "Adding to the published appcast."
          else
            echo "::notice::No published appcast: this release starts it."
            rm -f build/previous-appcast.xml
          fi
          python3 scripts/release/appcast.py --previous build/previous-appcast.xml \
            --version "$VERSION" --build "$BUILD" --url "$SITE/releases/$DMG" \
            --length "$LENGTH" --signature "$SIGNATURE" --notes-file build/notes.txt > build/appcast.xml
          jq -n --arg version "$VERSION" --argjson build "$BUILD" --arg file "$DMG" \
            '{version: $version, build: $build, file: $file}' > build/latest.json

      # 8. Release Worker (worker/): its zone routes answer /download, /appcast.xml and /releases/*
      - name: Deploy the release Worker
        if: steps.mode.outputs.release == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # 9. Upload: DMG, then appcast.xml, then latest.json, so nothing points at a missing file
      - name: Upload to R2
        if: steps.mode.outputs.release == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DMG: ${{ steps.mode.outputs.dmg }}
        run: |
          $WRANGLER r2 object put "$BUCKET/releases/$DMG" --remote --file "build/$DMG" \
            --content-type application/x-apple-diskimage
          $WRANGLER r2 object put "$BUCKET/appcast.xml" --remote --file build/appcast.xml \
            --content-type application/rss+xml
          $WRANGLER r2 object put "$BUCKET/latest.json" --remote --file build/latest.json \
            --content-type application/json

      # 10. GitHub Release for the tag, with the DMG and the tag annotation as notes
      - name: Publish the GitHub Release
        if: steps.mode.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DMG: ${{ steps.mode.outputs.dmg }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::notice::The GitHub Release $GITHUB_REF_NAME exists: replacing its DMG."
            gh release upload "$GITHUB_REF_NAME" "build/$DMG" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "build/$DMG" --notes-file build/notes.txt --verify-tag
          fi

      - name: Report a dry run
        if: steps.mode.outputs.release != 'true'
        run: |
          echo "::notice::Dry run done: unsigned build, tests and DMG only. Skipped: keychain import, Developer ID export, DMG signing, notarization, stapling, sign_update, appcast, Worker deploy, upload and GitHub Release."

      - name: Upload the dry-run DMG
        if: steps.mode.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mode.outputs.dmg }}
          path: build/${{ steps.mode.outputs.dmg }}
          retention-days: 7

      - name: Delete the temporary keychain
        if: always() && steps.mode.outputs.release == 'true'
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
