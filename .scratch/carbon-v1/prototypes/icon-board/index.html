<!doctype html>
<!--
  PROTOTYPE, throwaway. Answers the ticket "Icon board" (../../issues/11-icon-board.md).
  Round 2: five flat, minimal directions inspired by carbon (round 1 kept in round-1.html), switchable via ?variant=A|B|C|D|E|all.
  Open the file in a browser; ← / → cycle variants.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Carbon icon board</title>
<style>
  *, *::before, *::after { box-sizing: border-box; min-width: 0; }
  :root {
    color-scheme: light dark;
    text-wrap: pretty;
    font-synthesis: none;
    -webkit-font-smoothing: antialiased;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --bg: light-dark(oklch(0.97 0 none), oklch(0.17 0 none));
    --panel: light-dark(oklch(1 0 none), oklch(0.22 0 none));
    --ink: light-dark(oklch(0.2 0 none), oklch(0.95 0 none));
    --muted: light-dark(oklch(0.5 0 none), oklch(0.68 0 none));
    --line: light-dark(oklch(0.9 0 none), oklch(0.3 0 none));
    --wall-light: linear-gradient(160deg, oklch(0.9 0.04 230), oklch(0.82 0.06 300));
    --wall-dark: linear-gradient(160deg, oklch(0.32 0.06 260), oklch(0.18 0.05 300));
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  body { margin: 0; min-height: 100svh; background: var(--bg); color: var(--ink); padding: 2rem 1rem 6rem; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  svg { display: block; flex: none; }
  main { max-inline-size: 72rem; margin-inline: auto; display: flex; flex-direction: column; gap: 1.5rem; }
  header p { margin: 0.4rem 0 0; color: var(--muted); max-inline-size: 48rem; }
  .eyebrow { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 1rem; padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
  .panel h2 { font-size: 0.95rem; }
  .row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }

  .wall { border-radius: 0.75rem; padding: 1.5rem; display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: end; justify-content: safe center; flex: 1 1 20rem; }
  .wall.light { background: var(--wall-light); color: oklch(0.2 0 none); }
  .wall.dark { background: var(--wall-dark); color: oklch(0.95 0 none); }
  .size { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; font-size: 0.7rem; font-variant-numeric: tabular-nums; }
  .size span { opacity: 0.75; }

  .menubar { display: flex; align-items: center; justify-content: end; gap: 0.9rem; block-size: 24px; padding-inline: 0.75rem; border-radius: 0.5rem; font-size: 13px; font-weight: 500; }
  .menubar.light { background: oklch(0.97 0.01 250 / 0.85); color: oklch(0.15 0 none); }
  .menubar.dark { background: oklch(0.2 0.01 260 / 0.9); color: oklch(0.97 0 none); }
  .menubar .dummy { inline-size: 15px; block-size: 11px; border-radius: 3px; background: currentColor; opacity: 0.55; }
  .menubar .clock { font-variant-numeric: tabular-nums; }
  .bars { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); gap: 0.75rem; }
  .bars figure { margin: 0; display: flex; flex-direction: column; gap: 0.35rem; }
  .bars figcaption, .zoom figcaption { font-size: 0.75rem; color: var(--muted); }

  .zoom { display: flex; flex-wrap: wrap; gap: 1rem; }
  .zoom figure { margin: 0; display: flex; flex-direction: column; gap: 0.35rem; align-items: center; }
  .tile { inline-size: 7rem; aspect-ratio: 1; border-radius: 0.6rem; display: grid; place-items: center; }
  .tile.light { background: oklch(0.96 0 none); color: oklch(0.1 0 none); border: 1px solid var(--line); }
  .tile.dark { background: oklch(0.2 0 none); color: oklch(0.98 0 none); }

  .notif { inline-size: min(100%, 22rem); display: flex; gap: 0.7rem; align-items: start; padding: 0.75rem 0.85rem; border-radius: 1.1rem; backdrop-filter: blur(20px); font-size: 13px; line-height: 1.3; }
  .wall.light .notif { background: oklch(0.98 0 none / 0.72); }
  .wall.dark .notif { background: oklch(0.28 0 none / 0.72); }
  .notif strong { display: block; }
  .notif .actions { display: flex; gap: 0.4rem; margin-block-start: 0.5rem; }
  .notif .actions span { padding: 0.2rem 0.6rem; border-radius: 999px; background: oklch(0.5 0 none / 0.18); font-size: 12px; }
  .wall.notifs { align-items: start; }

  .overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: 1rem; }
  .overview .panel { align-items: center; text-align: center; }
  .overview a { color: inherit; text-decoration: none; }
  .overview .glyphs { display: flex; gap: 0.5rem; }
  .overview p { margin: 0; font-size: 0.85rem; color: var(--muted); }

  .switcher { position: fixed; inset-block-end: max(1rem, env(safe-area-inset-bottom, 0px)); inset-inline-start: 50%; translate: -50% 0; display: flex; align-items: center; gap: 0.25rem; padding: 0.3rem; border-radius: 999px; background: oklch(0.15 0 none); color: oklch(0.98 0 none); box-shadow: 0 8px 30px oklch(0 0 none / 0.35); font-size: 0.85rem; z-index: 10; }
  .switcher button { font: inherit; color: inherit; background: transparent; border: 0; border-radius: 999px; inline-size: 2.2rem; block-size: 2.2rem; cursor: pointer; touch-action: manipulation; user-select: none; transition: scale 120ms var(--ease-out); }
  .switcher button:active { scale: 0.96; }
  .switcher button:focus-visible { outline: max(2px, 0.08em) solid currentColor; outline-offset: 0.1em; }
  @media (hover: hover) and (pointer: fine) { .switcher button:hover { background: oklch(1 0 none / 0.12); } }
  .switcher output { padding-inline: 0.6rem; min-inline-size: 11rem; text-align: center; white-space: nowrap; }
</style>
</head>
<body>
<main id="app"></main>
<nav class="switcher" aria-label="Prototype variant">
  <button type="button" id="prev" aria-label="Previous variant">←</button>
  <output id="label"></output>
  <button type="button" id="next" aria-label="Next variant">→</button>
</nav>
<script>
const SQUIRCLE = 'x="100" y="100" width="824" height="824" rx="185"';
const CARBON = 'oklch(0.17 0 none)';
const WHITE = 'oklch(0.99 0 none)';
const RED = 'oklch(0.63 0.24 27)';
let uidCounter = 0;
const uid = () => `i${uidCounter++}`;

const hexPoints = (cx, cy, r) => Array.from({ length: 6 }, (_, k) => {
  const a = (-90 + 60 * k) * Math.PI / 180;
  return `${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`;
}).join(' ');

const hex = (cx, cy, r, sw, color) =>
  `<polygon points="${hexPoints(cx, cy, r)}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round"/>`;

function arc(cx, cy, r, gapDeg) {
  const a = gapDeg * Math.PI / 180;
  const x = cx + r * Math.cos(a), y1 = cy - r * Math.sin(a), y2 = cy + r * Math.sin(a);
  return `M ${x} ${y1} A ${r} ${r} 0 1 0 ${x} ${y2}`;
}

const lines = (segs, sw, color) =>
  `<g stroke="${color}" stroke-width="${sw}" stroke-linecap="round">${segs.map(([x1, y1, x2, y2]) =>
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`).join('')}</g>`;

function lattice(cx, cy, r) {
  const s = Math.sqrt(3) * r;
  return [[cx, cy - 0.75 * r], [cx - s / 2, cy + 0.75 * r], [cx + s / 2, cy + 0.75 * r]];
}

const hexVertices = (cx, cy, r) => Array.from({ length: 6 }, (_, k) => {
  const a = (-90 + 60 * k) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
});

function roundedHex(cx, cy, r, rc, sw, color) {
  const v = hexVertices(cx, cy, r);
  const t = rc / r;
  const toward = ([x, y], [tx, ty]) => `${x + (tx - x) * t},${y + (ty - y) * t}`;
  const d = v.map((p, i) => {
    const prev = v[(i + 5) % 6], next = v[(i + 1) % 6];
    return `${i ? 'L' : 'M'} ${toward(p, prev)} Q ${p.join(',')} ${toward(p, next)}`;
  }).join(' ');
  return `<path d="${d} Z" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round"/>`;
}

// The three cells share one vertex at (cx, cy + r / 4); the dot sits there inside a masked gap.
function dottedLattice(size, cx, cy, r, sw, dotR, gapR, fg, dotFill = fg, rc = 0) {
  const id = uid();
  const jy = cy + r / 4;
  const cell = ([x, y]) => rc ? roundedHex(x, y, r, rc, sw, fg) : hex(x, y, r, sw, fg);
  return `<mask id="${id}-gap"><rect width="${size}" height="${size}" fill="white"/><circle cx="${cx}" cy="${jy}" r="${gapR}" fill="black"/></mask>
    <g mask="url(#${id}-gap)">${lattice(cx, cy, r).map(cell).join('')}</g>
    <circle cx="${cx}" cy="${jy}" r="${dotR}" fill="${dotFill}"/>`;
}

// Same lattice drawn edge by edge, so the three edges meeting the dot stop short of it on round caps.
function cappedLattice(cx, cy, r, sw, dotR, tip, fg, dotFill = fg) {
  const jx = cx, jy = cy + r / 4;
  const key = ([x, y]) => `${x.toFixed(2)},${y.toFixed(2)}`;
  const edges = new Map();
  for (const [x, y] of lattice(cx, cy, r)) {
    const v = hexVertices(x, y, r);
    v.forEach((p, i) => {
      const q = v[(i + 1) % 6];
      edges.set([key(p), key(q)].sort().join('|'), [p, q]);
    });
  }
  const stop = tip + sw / 2;
  const segs = [...edges.values()].map(([p, q]) => {
    const atJ = (pt) => Math.hypot(pt[0] - jx, pt[1] - jy) < 0.01;
    if (atJ(q)) [p, q] = [q, p];
    if (!atJ(p)) return [...p, ...q];
    const len = Math.hypot(q[0] - p[0], q[1] - p[1]);
    const f = stop / len;
    return [p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f, ...q];
  });
  return `${lines(segs, sw, fg)}<circle cx="${jx}" cy="${jy}" r="${dotR}" fill="${dotFill}"/>`;
}

// Each cell is one open path from cap to cap around its five other corners. Neighbouring cells start on the
// same cap point and stay on the shared spoke up to the fork, so their strokes overlap exactly.
function softCappedLattice(cx, cy, r, sw, dotR, tip, rc, spokeRc, valleyRc, fg, dotFill = fg) {
  const jx = cx, jy = cy + r / 4;
  const stop = tip + sw / 2;
  const point = ([x, y], [tx, ty], d) => [x + (tx - x) * d / r, y + (ty - y) * d / r];
  const along = (p, t, d) => point(p, t, d).join(',');
  // Cubic handles at 0.619 of the tangent length approximate a circular arc for a 60° turn, without the quadratic's pointed apex.
  const corner = (p, prev, next, dIn, dOut) => {
    const a = point(p, prev, dIn), b = point(p, next, dOut);
    const c1 = point(a, p, 0.619 * r), c2 = point(b, p, 0.619 * r);
    return `L ${a.join(',')} C ${c1.join(',')} ${c2.join(',')} ${b.join(',')}`;
  };
  const stroke = (d) => `<path d="${d}" fill="none" stroke="${fg}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
  // Where two cells meet at a fork, their outer edges leave a V; a fillet between the two edges fills it with a round valley.
  const forks = new Map();
  const cells = lattice(cx, cy, r).map(([x, y]) => {
    const v = hexVertices(x, y, r);
    const k = v.findIndex(([px, py]) => Math.hypot(px - jx, py - jy) < 0.01);
    const path = [1, 2, 3, 4, 5].map(i => v[(k + i) % 6]);
    const j = v[k];
    for (const [f, outer] of [[path[0], path[1]], [path[4], path[3]]]) {
      const id = f.map(n => n.toFixed(2)).join(',');
      forks.set(id, [...(forks.get(id) ?? [f]), outer]);
    }
    let d = `M ${along(j, path[0], stop)}`;
    path.forEach((p, i) => {
      const prev = i ? path[i - 1] : j, next = i < 4 ? path[i + 1] : j;
      const dIn = i === 0 ? spokeRc : i === 4 ? valleyRc : rc, dOut = i === 4 ? spokeRc : i === 0 ? valleyRc : rc;
      d += ` ${corner(p, prev, next, dIn, dOut)}`;
    });
    d += ` L ${along(j, path[4], stop)}`;
    return stroke(d);
  });
  const valleys = [...forks.values()].map(([f, a, b]) => stroke(corner(f, a, b, valleyRc, valleyRc).replace(/^L/, 'M')));
  return `${cells.join('')}${valleys.join('')}<circle cx="${jx}" cy="${jy}" r="${dotR}" fill="${dotFill}"/>`;
}

function gem(cx, top, girdle, bottom, r) {
  const t = 0.5 * r;
  return {
    outline: `${cx - t},${top} ${cx + t},${top} ${cx + r},${girdle} ${cx},${bottom} ${cx - r},${girdle}`,
    facets: [[cx - r, girdle, cx + r, girdle], [cx - t, top, cx - 0.3 * r, girdle], [cx + t, top, cx + 0.3 * r, girdle], [cx - 0.3 * r, girdle, cx, bottom], [cx + 0.3 * r, girdle, cx, bottom]],
  };
}

// Each variant draws its mark in a 1024 grid (app icon) and an 18 pt grid (menu bar glyph).
const VARIANTS = {
  A: {
    name: 'Ring + voice',
    idea: 'Round 1\'s graphene ring, flattened: one hexagon, three voice bars. The app icon is the menu bar glyph, scaled.',
    mark: (fg) => `${hex(512, 512, 270, 56, fg)}${lines([[412, 432, 412, 592], [512, 362, 512, 662], [612, 412, 612, 612]], 56, fg)}`,
    glyph: (rec) => `${hex(9, 9, 7.6, 1.4, 'currentColor')}${rec
      ? `<circle cx="9" cy="9" r="3.1" fill="${RED}"/>`
      : lines([[6.3, 7.4, 6.3, 10.6], [9, 5.8, 9, 12.2], [11.7, 7, 11.7, 11]], 1.5, 'currentColor')}`,
    recNote: 'The bars become the red dot.',
  },

  B: {
    name: 'Benzene',
    idea: 'The chemist\'s aromatic ring: a hexagon with a circle inside. The circle is a ready-made record button.',
    mark: (fg) => `${hex(512, 512, 280, 56, fg)}<circle cx="512" cy="512" r="130" fill="none" stroke="${fg}" stroke-width="56"/>`,
    glyph: (rec) => `${hex(9, 9, 7.6, 1.4, 'currentColor')}${rec
      ? `<circle cx="9" cy="9" r="3.6" fill="${RED}"/>`
      : '<circle cx="9" cy="9" r="3.4" fill="none" stroke="currentColor" stroke-width="1.4"/>'}`,
    recNote: 'The inner circle fills red.',
  },

  C: {
    name: 'Graphene',
    idea: 'Three cells of the graphene lattice, with a dot where they meet, cut free by a gap. The dot is the recording light.',
    mark: (fg) => dottedLattice(1024, 512, 512, 150, 44, 52, 100, fg),
    glyph: (rec) => dottedLattice(18, 9, 9, 4.1, 1.3, 1.5, 2.7, 'currentColor', rec ? RED : 'currentColor'),
    recNote: 'The central dot turns red.',
  },

  C2: {
    name: 'Graphene, soft',
    idea: 'C with softened hexagon corners: same lattice, dot and gap, friendlier silhouette.',
    mark: (fg) => dottedLattice(1024, 512, 512, 150, 44, 52, 100, fg, fg, 42),
    glyph: (rec) => dottedLattice(18, 9, 9, 4.1, 1.3, 1.5, 2.7, 'currentColor', rec ? RED : 'currentColor', 1.15),
    recNote: 'The central dot turns red.',
  },

  C3: {
    name: 'Graphene, rounded ends',
    idea: 'C without the cut: the three edges meeting the dot stop short on round caps, so the gap is drawn, not masked.',
    mark: (fg) => cappedLattice(512, 512, 150, 44, 48, 84, fg),
    glyph: (rec) => cappedLattice(9, 9, 4.1, 1.3, 1.4, 2.4, 'currentColor', rec ? RED : 'currentColor'),
    recNote: 'The central dot turns red.',
  },

  C4: {
    name: 'Graphene, ultra soft',
    idea: 'C3\'s rounded ends with deeply rounded corners: the cells read as soft pebbles around the dot.',
    mark: (fg) => softCappedLattice(512, 512, 150, 44, 48, 84, 75, 40, 40, fg),
    glyph: (rec) => softCappedLattice(9, 9, 4.1, 1.3, 1.4, 2.4, 2.05, 1, 1.1, 'currentColor', rec ? RED : 'currentColor'),
    recNote: 'The central dot turns red.',
  },

  D: {
    name: 'Element C',
    idea: 'Carbon\'s periodic-table tile: atomic number 6 and the symbol C. The app icon is the tile itself.',
    mark: (fg) => `
      <text x="250" y="330" fill="${fg}" font-family="-apple-system, system-ui, sans-serif" font-size="120" font-weight="600">6</text>
      <path d="${arc(530, 560, 200, 48)}" fill="none" stroke="${fg}" stroke-width="72" stroke-linecap="round"/>`,
    glyph: (rec) => `
      <rect x="1.7" y="1.7" width="14.6" height="14.6" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <path d="${arc(10, 10.4, 3.5, 50)}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      ${rec ? `<circle cx="5.2" cy="5.2" r="1.7" fill="${RED}"/>` : ''}`,
    recNote: 'A red dot takes the atomic number\'s corner.',
  },

  E: {
    name: 'Diamond',
    idea: 'Carbon at its hardest: a flat gem outline. Reads instantly, but says "precious" more than "transcript".',
    mark: (fg) => {
      const g = gem(512, 310, 430, 730, 290);
      return `<polygon points="${g.outline}" fill="none" stroke="${fg}" stroke-width="48" stroke-linejoin="round"/>${lines(g.facets, 32, fg)}`;
    },
    glyph: (rec) => {
      const g = gem(9, 3, 7, 15.6, 7.6);
      return `<polygon points="${g.outline}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>${rec
        ? `${lines([g.facets[0]], 1, 'currentColor')}<circle cx="9" cy="10.6" r="1.9" fill="${RED}"/>`
        : lines(g.facets, 1, 'currentColor')}`;
    },
    recNote: 'The lower facets give way to a red dot.',
  },
};

const KEYS = [...Object.keys(VARIANTS), 'all'];

function appIcon(v, size, inverted = false) {
  const [bg, fg] = inverted ? [WHITE, CARBON] : [CARBON, WHITE];
  const edge = inverted ? `<rect ${SQUIRCLE} fill="none" stroke="oklch(0 0 none / 0.1)" stroke-width="4"/>` : '';
  return `<div style="inline-size:${size}px"><svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <rect ${SQUIRCLE} fill="${bg}"/>${edge}${VARIANTS[v].mark(fg)}</svg></div>`;
}

const glyph = (v, rec, size) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${VARIANTS[v].glyph(rec)}</svg>`;

const menubar = (v, theme, rec) => `
  <div class="menubar ${theme}">
    <span class="dummy"></span><span class="dummy"></span>${glyph(v, rec, 18)}<span class="dummy"></span><span class="clock">Tue Oct 27  14:02</span>
  </div>`;

const notification = (v) => `
  <div class="notif">${appIcon(v, 40)}
    <div><strong>Carbon</strong>Transcribing in English · Weekly sync
      <div class="actions"><span>Stop</span><span>Switch language ▸</span></div>
    </div>
  </div>`;

function renderVariant(v) {
  const meta = VARIANTS[v];
  const sizes = (theme, inverted) => `<div class="wall ${theme}">${[256, 128, 64, 32, 16].map(s =>
    `<div class="size">${appIcon(v, s, inverted)}<span>${s}</span></div>`).join('')}</div>`;
  const zoom = ['light', 'dark'].flatMap(theme => [false, true].map(rec =>
    `<figure><div class="tile ${theme}">${glyph(v, rec, 90)}</div><figcaption>${theme} · ${rec ? 'recording' : 'idle'}</figcaption></figure>`)).join('');
  const bars = ['light', 'dark'].flatMap(theme => [false, true].map(rec =>
    `<figure>${menubar(v, theme, rec)}<figcaption>${theme} menu bar · ${rec ? 'recording' : 'idle'}</figcaption></figure>`)).join('');
  return `
    <header>
      <div class="eyebrow">Carbon icon board · round 2 · direction ${v}</div>
      <h1>${meta.name}</h1>
      <p>${meta.idea}</p>
    </header>
    <section class="panel"><h2>App icon, carbon black (top) and inverted (bottom)</h2>
      <div class="row">${sizes('light', false)}${sizes('dark', false)}</div>
      <div class="row">${sizes('light', true)}${sizes('dark', true)}</div>
    </section>
    <section class="panel"><h2>Menu bar template icon, real size (18 pt)</h2>
      <div class="bars">${bars}</div>
    </section>
    <section class="panel"><h2>Menu bar icon, 5× · ${meta.recNote}</h2>
      <div class="zoom">${zoom}</div>
    </section>
    <section class="panel"><h2>Start notification</h2>
      <div class="row"><div class="wall light notifs">${notification(v)}</div><div class="wall dark notifs">${notification(v)}</div></div>
    </section>`;
}

function renderOverview() {
  return `
    <header>
      <div class="eyebrow">Carbon icon board · round 2 · overview</div>
      <h1>Flat, minimal, carbon</h1>
      <p>One color, one mark, no gradients. Pick one, or name the parts to steal. Click a card to open its full board. Round 1 lives in round-1.html.</p>
    </header>
    <div class="overview">${Object.entries(VARIANTS).map(([k, m]) => `
      <a href="?variant=${k}" class="panel">
        <div class="glyphs">${appIcon(k, 112)}${appIcon(k, 112, true)}</div>
        <h2>${k} · ${m.name}</h2>
        <div class="glyphs">
          <div class="tile light" style="inline-size:3.5rem">${glyph(k, false, 36)}</div>
          <div class="tile light" style="inline-size:3.5rem">${glyph(k, true, 36)}</div>
          <div class="tile dark" style="inline-size:3.5rem">${glyph(k, false, 36)}</div>
          <div class="tile dark" style="inline-size:3.5rem">${glyph(k, true, 36)}</div>
        </div>
        <p>${m.idea}</p>
      </a>`).join('')}
    </div>`;
}

function current() {
  const v = new URLSearchParams(location.search).get('variant');
  return KEYS.includes(v) ? v : 'all';
}

function render() {
  const v = current();
  uidCounter = 0;
  document.getElementById('app').innerHTML = v === 'all' ? renderOverview() : renderVariant(v);
  document.getElementById('label').textContent = v === 'all' ? 'Overview' : `${v} (${VARIANTS[v].name})`;
}

function go(step) {
  const i = (KEYS.indexOf(current()) + step + KEYS.length) % KEYS.length;
  const url = new URL(location.href);
  url.searchParams.set('variant', KEYS[i]);
  history.replaceState(null, '', url);
  render();
}

document.getElementById('prev').addEventListener('click', () => go(-1));
document.getElementById('next').addEventListener('click', () => go(1));
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});
render();
</script>
</body>
</html>
