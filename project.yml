name: Carbon
options:
  bundleIdPrefix: me.alexandrejoly
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  CarbonCore:
    path: CarbonCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.17.7
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Carbon:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Design/Carbon.icon
        type: file
        buildPhase: resources
      - path: App/DiarizationModels
        type: folder
        buildPhase: resources
    dependencies:
      - package: CarbonCore
      - package: Sparkle
      - target: CarbonDiarizer
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Carbon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Alexandre Joly"
        NSMicrophoneUsageDescription: Carbon transcribes your side of a Meeting from the microphone, on this Mac.
        NSAudioCaptureUsageDescription: Carbon transcribes everyone else in a Meeting from the call's audio, on this Mac.
        SUFeedURL: https://carbon.alexandrejoly.me/appcast.xml
        SUPublicEDKey: DmKfoKmWRW4yVkZNN0nq1w3x4uu6e/qkz5YXE1zN+ZE=
        SUEnableAutomaticChecks: true
        NSCalendarsFullAccessUsageDescription: Carbon names each Meeting and lists its participants from the matching calendar event, on this Mac.
    entitlements:
      path: App/Carbon.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.alexandrejoly.carbon
        PRODUCT_NAME: Carbon
        PRODUCT_MODULE_NAME: CarbonApp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: Carbon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
  # FluidAudio diarization of the Them stream, run by the app in a fresh process per attempt.
  CarbonDiarizer:
    type: tool
    platform: macOS
    sources:
      - path: Diarizer
    dependencies:
      - package: CarbonCore
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.alexandrejoly.carbon.diarizer
        PRODUCT_NAME: CarbonDiarizer
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES
        DEAD_CODE_STRIPPING: YES
